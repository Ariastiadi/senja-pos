<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk — SENJA POS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bcrypt.js/2.4.3/bcrypt.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;font-family:'Plus Jakarta Sans',sans-serif;
    background:#1a1310;color:#f3ead9;padding:20px;
    background-image:radial-gradient(rgba(224,138,46,.07) 1px,transparent 1px),
      radial-gradient(700px 500px at 85% 15%,rgba(224,138,46,.12),transparent 70%),
      radial-gradient(600px 400px at 10% 90%,rgba(47,125,82,.10),transparent 70%);
    background-size:26px 26px,auto,auto}
  .wrap{width:100%;max-width:400px}
  .brand{text-align:center;margin-bottom:26px}
  .badge{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;font-size:32px;
    background:linear-gradient(140deg,#f2a950,#b9641a);box-shadow:0 10px 30px rgba(224,138,46,.35);position:relative}
  .steam{position:absolute;top:-16px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
  .steam i{width:3px;height:12px;border-radius:3px;background:rgba(243,234,217,.5);animation:steam 2s infinite}
  .steam i:nth-child(2){animation-delay:.4s}.steam i:nth-child(3){animation-delay:.8s}
  @keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-12px);opacity:0}}
  h1{font-family:'Bricolage Grotesque';font-size:30px;letter-spacing:.5px}
  .sub{color:#b8a892;font-size:13px;margin-top:5px;font-weight:600}
  form{background:#241a14;border:1px solid #3d2d21;border-radius:20px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  label{display:block;font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#b8a892;margin:14px 0 7px}
  input{width:100%;background:#1a1310;border:1.5px solid #3d2d21;border-radius:12px;padding:13px 15px;
    color:#f3ead9;font-size:15px;font-family:inherit;outline:none;transition:.2s}
  input:focus{border-color:#e08a2e;box-shadow:0 0 0 3px rgba(224,138,46,.18)}
  #pin{font-family:'Space Mono',monospace;letter-spacing:8px;font-size:18px}
  button{width:100%;margin-top:20px;padding:15px;border:none;border-radius:13px;font-family:'Bricolage Grotesque';
    font-weight:800;font-size:16px;letter-spacing:.5px;color:#2a1708;cursor:pointer;
    background:linear-gradient(115deg,#e08a2e,#b9641a);transition:.2s}
  button:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(224,138,46,.4)}
  button:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .err{background:rgba(200,80,62,.15);border:1px solid rgba(200,80,62,.5);color:#f2a595;
    border-radius:10px;padding:11px 13px;font-size:13px;font-weight:700;margin-top:14px;animation:shake .3s;display:none}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .hint{margin-top:18px;background:rgba(255,255,255,.04);border:1px dashed #3d2d21;border-radius:12px;
    padding:13px 15px;font-size:12.5px;color:#b8a892;line-height:1.9}
  .hint b{color:#f2d9ae}
  .setup-note{margin-top:14px;text-align:center;font-size:11.5px;color:#8a7d6a}
  .setup-note a{color:#f2a950}
</style></head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="badge"><div class="steam"><i></i><i></i><i></i></div>☕</div>
    <h1>SENJA POS</h1>
    <div class="sub">Kasir Kafe &amp; Hotel — Masuk untuk membuka shift</div>
  </div>
  <form id="loginForm" autocomplete="off">
    <label>Username</label>
    <input name="username" id="username" required autofocus placeholder="cth: rani">
    <label>PIN</label>
    <input type="password" name="pin" id="pin" required maxlength="8" inputmode="numeric" placeholder="••••">
    <button type="submit" id="btnSubmit">Masuk &amp; Buka Kasir →</button>
    <div class="err" id="errBox"></div>
  </form>
  <div class="hint">
    <b>Akun demo (setelah dijalankan seed.html):</b><br>
    👤 Kasir — <b>rani</b> / PIN <b>1234</b> &nbsp;·&nbsp; <b>bima</b> / PIN <b>2345</b><br>
    🛡️ Admin — <b>admin</b> / PIN <b>9999</b> (bisa kelola stok &amp; resep)
  </div>
  <div class="setup-note">Database masih kosong? Jalankan <a href="seed.html">seed.html</a> dulu satu kali.</div>
</div>

<script src="firebase-init.js"></script>
<script>
if (currentUser()) location.href = 'index.html';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('errBox');
  const btn = document.getElementById('btnSubmit');
  errBox.style.display = 'none';
  const username = document.getElementById('username').value.trim().toLowerCase();
  const pin = document.getElementById('pin').value;
  btn.disabled = true; btn.textContent = 'Memeriksa…';
  try {
    const doc = await db.collection('users').doc(username).get();
    if (!doc.exists) throw new Error('Username atau PIN salah. Coba lagi.');
    const u = doc.data();
    const ok = await new Promise((resolve, reject) => {
      bcrypt.compare(pin, u.pinHash, (err, res) => err ? reject(err) : resolve(res));
    });
    if (!ok) throw new Error('Username atau PIN salah. Coba lagi.');
    setCurrentUser({ id: username, nama: u.nama, username, role: u.role });
    location.href = 'index.html';
  } catch (err) {
    errBox.textContent = '⚠️ ' + err.message;
    errBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Masuk & Buka Kasir →';
  }
});
</script>
<link rel="stylesheet" href="deai.css">
<script src="deai.js"></script>
</body></html>
