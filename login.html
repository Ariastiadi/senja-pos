<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk — SENJA POS</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;font-family:'Plus Jakarta Sans',sans-serif;
    background:#1a1310;color:#f3ead9;padding:20px;
    background-image:radial-gradient(rgba(224,138,46,.07) 1px,transparent 1px);background-size:26px 26px}
  .wrap{width:100%;max-width:400px}
  .brand{text-align:center;margin-bottom:24px}
  .badge{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;font-size:30px;
    background:linear-gradient(140deg,#f2a950,#b9641a);box-shadow:0 10px 30px rgba(224,138,46,.35);position:relative}
  .steam{position:absolute;top:-15px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
  .steam i{width:3px;height:12px;border-radius:3px;background:rgba(243,234,217,.5);animation:steam 2s infinite}
  .steam i:nth-child(2){animation-delay:.4s}.steam i:nth-child(3){animation-delay:.8s}
  @keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-12px);opacity:0}}
  h1{font-family:'Bricolage Grotesque';font-size:30px;letter-spacing:.5px}
  .sub{color:#b8a892;font-size:13px;margin-top:5px;font-weight:600}
  form{background:#241a14;border:1px solid #3d2d21;border-radius:20px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  label{display:block;font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#b8a892;margin:14px 0 7px}
  input{width:100%;background:#1a1310;border:1.5px solid #3d2d21;border-radius:12px;padding:13px 15px;
    color:#f3ead9;font-size:15px;font-family:inherit;outline:none;transition:.2s}
  input:focus{border-color:#e08a2e;box-shadow:0 0 0 3px rgba(224,138,46,.18)}
  input[name="pin"]{letter-spacing:8px;font-size:18px}
  button{width:100%;margin-top:20px;padding:15px;border:none;border-radius:13px;font-family:'Bricolage Grotesque';
    font-weight:800;font-size:16px;letter-spacing:.5px;color:#2a1708;cursor:pointer;
    background:linear-gradient(115deg,#e08a2e,#b9641a);transition:.2s}
  button:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(224,138,46,.4)}
  button:disabled{opacity:.6;cursor:not-allowed}
  .err{background:rgba(200,80,62,.15);border:1px solid rgba(200,80,62,.5);color:#f2a595;
    border-radius:10px;padding:11px 13px;font-size:13px;font-weight:700;margin-top:14px}
  .hint{margin-top:18px;background:rgba(255,255,255,.04);border:1px dashed #3d2d21;border-radius:12px;
    padding:13px 15px;font-size:12.5px;color:#b8a892;line-height:1.9}
  .hint b{color:#f2d9ae}
  .seed{margin-top:12px;text-align:center;font-size:12px;color:#8a7d6a}
  .seed a{color:#f2a950}
</style></head><body>
<div class="wrap">
  <div class="brand">
    <div class="badge"><div class="steam"><i></i><i></i><i></i></div>☕</div>
    <h1>SENJA POS</h1>
    <div class="sub">Kasir Kafe &amp; Hotel — Masuk untuk membuka shift</div>
  </div>
  <form id="form" autocomplete="off">
    <label>Username</label>
    <input name="username" required autofocus placeholder="cth: rani">
    <label>PIN</label>
    <input type="password" name="pin" required maxlength="8" inputmode="numeric" placeholder="••••">
    <button type="submit" id="btn">Masuk &amp; Buka Kasir →</button>
    <div id="err" class="err" style="display:none"></div>
  </form>
  <div class="hint">
    <b>Akun demo (setelah dijalankan seed.html):</b><br>
    👤 Kasir — <b>rani</b> / PIN <b>1234</b> · <b>bima</b> / PIN <b>2345</b><br>
    🛡️ Admin — <b>admin</b> / PIN <b>9999</b> (bisa kelola stok &amp; resep)
  </div>
  <div class="seed">Database masih kosong? Jalankan <a href="seed.html">seed.html</a> dulu satu kali.</div>
</div>

<script src="firebase-init.js"></script>
<script>
/* Hash PIN lokal — HARUS sama persis dengan yang di seed.html */
function pinHash(pin){
  var s = String(pin), h1 = 5381, h2 = 52711;
  for (var i = 0; i < s.length; i++){
    var c = s.charCodeAt(i);
    h1 = ((h1 << 5) + h1 + c) | 0;
    h2 = ((h2 << 5) + h2 + c * 7) | 0;
  }
  return 'v1$' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}

document.getElementById('form').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Memeriksa…';
  try {
    const username = new FormData(this).get('username').toString().trim().toLowerCase();
    const pin = new FormData(this).get('pin').toString();
    const snap = await db.collection('users').where('username','==',username).limit(1).get();
    if (snap.empty) throw new Error('Username tidak ditemukan.');
    const doc = snap.docs[0], u = doc.data();
    if (String(u.pinHash || '').indexOf('v1$') !== 0)
      throw new Error('Akun masih pakai hash lama — jalankan seed.html satu kali lagi.');
    if (pinHash(pin) !== u.pinHash) throw new Error('PIN salah.');
    setCurrentUser({ id: doc.id, nama: u.nama, username: u.username, role: u.role });
    location.href = 'index.html';
  } catch (er) {
    err.textContent = '⚠️ ' + er.message;
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Masuk & Buka Kasir →';
  }
});
</script>
<link rel="stylesheet" href="deai.css">
<script src="deai.js"></script>
</body></html>
