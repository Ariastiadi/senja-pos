<style>
:root{--roast:#180f0a;--roast2:#241a14;--paper:#f6f1e6;--card:#ffffff;--line:#ece2ce;--muted:#8f8171;
--amber:#e2872a;--amber-deep:#b8611a;--amber-soft:#fbeada;--green:#2f7d52;--red:#c8503e;--blue:#24618a;
--sh-sm:0 1px 2px rgba(120,72,20,.06);--sh-md:0 10px 24px rgba(120,72,20,.09);--sh-lg:0 20px 48px rgba(24,15,10,.16);
--disp:'Bricolage Grotesque',sans-serif;--body:'Plus Jakarta Sans',sans-serif;--mono:'Space Mono',monospace}
*{box-sizing:border-box;margin:0}html,body{-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}body{font-family:var(--body);background:var(--paper);color:var(--roast);min-height:100vh;min-height:100dvh}
header{background:linear-gradient(165deg,var(--roast),var(--roast2));color:#f3ead9;padding:15px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:10;box-shadow:var(--sh-lg)}
header h1{font-family:var(--disp);font-size:20px;display:flex;align-items:center;gap:10px}
.btn{background:linear-gradient(150deg,var(--amber),var(--amber-deep));color:#fff;border:none;padding:10px 17px;border-radius:11px;font-weight:700;cursor:pointer;font-family:var(--body);font-size:13px;transition:.18s;display:inline-flex;align-items:center;gap:6px;box-shadow:0 6px 16px rgba(185,97,26,.25);touch-action:manipulation;-webkit-appearance:none}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(185,97,26,.32)}
.btn-outline{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);color:#e8d9c2;box-shadow:none}
.btn-outline:hover{background:rgba(255,255,255,.1);box-shadow:none;transform:translateY(-1px)}
.btn-ghost{background:var(--card);color:var(--roast);border:1.5px solid var(--line);box-shadow:var(--sh-sm)}
.btn-ghost:hover{border-color:var(--amber);color:var(--amber-deep)}
.container{max-width:1250px;margin:20px auto;padding:0 20px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px;background:var(--card);padding:15px;border-radius:16px;border:1px solid var(--line);box-shadow:var(--sh-sm)}
.toolbar label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.toolbar select,.toolbar input[type="date"]{padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--body);font-size:13px;background:var(--paper);outline:none}
.toolbar select:focus,.toolbar input:focus{border-color:var(--amber)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:24px;overflow-x:auto;scrollbar-width:thin}
.tab{padding:12px 20px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;transition:.18s;border-radius:8px 8px 0 0;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tab:hover{color:var(--roast);background:rgba(224,138,46,.06)}
.tab.active{color:var(--amber-deep);border-color:var(--amber)}
.panel{display:none;animation:fadeIn .3s}.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:24px;box-shadow:var(--sh-sm)}
.card h3{font-family:var(--disp);font-size:18px;margin-bottom:16px;color:var(--roast);display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--amber-soft);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--amber-deep);font-weight:800;position:sticky;top:0}
.num{text-align:right;font-family:var(--mono);font-weight:600}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:var(--card);padding:20px;border-radius:20px;border:1px solid rgba(255,255,255,.7);position:relative;overflow:hidden;transition:.18s;
  box-shadow:-6px -6px 14px rgba(255,255,255,.85),8px 10px 20px rgba(120,72,20,.13)}
.kpi:hover{transform:translateY(-2px);box-shadow:-6px -6px 14px rgba(255,255,255,.9),10px 14px 24px rgba(120,72,20,.17)}
.kpi::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--amber)}
.kpi.green::before{background:var(--green)}.kpi.red::before{background:var(--red)}.kpi.blue::before{background:var(--blue)}
.kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.5px}
.kpi .value{font-family:var(--disp);font-size:26px;margin-top:6px;color:var(--roast)}
.kpi .value.green{color:var(--green)}.kpi .value.red{color:var(--red)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:15px}
.form-grid label{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block}
input,select{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:var(--body);font-size:14px;background:var(--paper);outline:none;transition:.2s;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(224,138,46,.1)}
.badge{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.3px}
.b-pos{background:#e4f0e8;color:var(--green)}.b-neg{background:#fbe9e5;color:var(--red)}
.row-total{background:#fbf7ec;font-weight:800;font-family:var(--disp);font-size:15px}
.row-subtotal{font-weight:700;color:var(--amber-deep)}
.indent{padding-left:30px!important;color:var(--muted)}
.loader{text-align:center;padding:40px;color:var(--muted);font-weight:600}
.empty{text-align:center;padding:40px;color:var(--muted);font-style:italic}
.muted-sm{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);margin-left:8px}
button:disabled{opacity:.5;cursor:not-allowed}
@media print{header,.tabs,.no-print,.toolbar{display:none!important}.panel{display:block!important}.card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}}
@media(max-width:768px){.kpi-grid{grid-template-columns:1fr 1fr}.kpi .value{font-size:20px}}
</style>

<header>
  <h1>📊 Modul Keuangan & Akuntansi</h1>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn btn-outline no-print" onclick="exportPDF()">🧾 Export PDF</button>
    <button class="btn btn-outline no-print" onclick="exportExcel()">📊 Export Excel</button>
    <button class="btn btn-outline no-print" onclick="exportCSV()">📥 Export CSV</button>
    <button class="btn btn-outline no-print" onclick="window.print()">🖨️ Cetak</button>
    <button class="btn btn-outline no-i18n" data-lang-btn onclick="window.SENJA_LANG && SENJA_LANG.toggle()">🌐 ID</button>
    <a href="index.html" class="btn btn-ghost">← Kembali ke Kasir</a>
  </div>
</header>

<div class="container">
  <div class="toolbar no-print">
    <label>Periode:</label>
    <select id="periodFilter" onchange="changePeriod()">
      <option value="all">Semua Waktu</option>
      <option value="today">Hari Ini</option>
      <option value="month" selected>Bulan Ini</option>
      <option value="year">Tahun Ini</option>
      <option value="custom">Custom...</option>
    </select>
    <input type="date" id="dateFrom" style="display:none" onchange="applyPeriod()">
    <input type="date" id="dateTo" style="display:none" onchange="applyPeriod()">
  </div>

  <div class="tabs no-print">
    <div class="tab active" onclick="showTab('dashboard', this)">Dashboard</div>
    <div class="tab" onclick="showTab('labarugi', this)">Laba / Rugi</div>
    <div class="tab" onclick="showTab('neraca', this)">Neraca</div>
    <div class="tab" onclick="showTab('jurnal', this)">Jurnal Umum</div>
    <div class="tab" onclick="showTab('gl', this)">Buku Besar</div>
    <div class="tab" onclick="showTab('tb', this)">Neraca Saldo</div>
    <div class="tab" onclick="showTab('manual', this)">Input Manual</div>
  </div>

  <div id="dashboard" class="panel active"><div class="loader">Memuat data...</div></div>
  <div id="labarugi" class="panel"></div>
  <div id="neraca" class="panel"></div>
  <div id="jurnal" class="panel"></div>
  <div id="gl" class="panel"></div>
  <div id="tb" class="panel"></div>
  
  <div id="manual" class="panel no-print">
    <div class="card">
      <h3>✍️ Input Jurnal Manual (Beban / Pembelian Aset)</h3>
      <div class="form-grid">
        <div><label>Tanggal</label><input type="date" id="mDate"></div>
        <div><label>Keterangan</label><input type="text" id="mDesc" placeholder="cth: Bayar Listrik Toko"></div>
        <div><label>Akun Debit</label><select id="mDr"></select></div>
        <div><label>Akun Kredit</label><select id="mCr"></select></div>
        <div><label>Nominal (Rp)</label><input type="number" id="mAmt" min="0" placeholder="0"></div>
      </div>
      <button class="btn" id="btnSaveManual" onclick="saveManual()">💾 Simpan Jurnal</button>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="firebase-init.js"></script>
<script>
const $ = id => document.getElementById(id);
const LOC = () => (window.SENJA_LANG ? SENJA_LANG.loc() : 'id-ID');
const T = s => (window.SENJA_LANG ? SENJA_LANG.t(s) : s);
const accRp = n => n < 0 ? `(${rp(Math.abs(n))})` : rp(n);
const jDate = j => (j.date && j.date.toDate ? j.date.toDate() : new Date(j.date));
const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
let COA = [], JRN = [], PERIOD = [], CUM = [];

/* Akun yang dipakai jurnal otomatis kasir. Dipakai kalau koleksi `coa` belum punya akun tsb. */
const COA_DEFAULT = [
  ['1101','Kas','Aset','Debit'], ['1102','Bank / E-Wallet','Aset','Debit'], ['1110','Persediaan Bahan','Aset','Debit'],
  ['2101','Utang Pajak','Kewajiban','Kredit'], ['3101','Modal Pemilik','Ekuitas','Kredit'],
  ['4101','Pendapatan Kafe','Pendapatan','Kredit'], ['4102','Pendapatan Kamar','Pendapatan','Kredit'], ['4103','Pendapatan Room Service','Pendapatan','Kredit'],
  ['4104','Pendapatan Laundry','Pendapatan','Kredit'], ['4105','Pendapatan Spa','Pendapatan','Kredit'], ['4106','Pendapatan Minibar','Pendapatan','Kredit'],
  ['5101','HPP','HPP','Debit'], ['6101','Beban Gaji','Beban','Debit'], ['6102','Beban Listrik & Air','Beban','Debit'], ['6103','Beban Sewa','Beban','Debit'], ['6109','Beban Lain-lain','Beban','Debit']
].map(([id,nama,tipe,normal]) => ({id, nama, tipe, normal}));
function inferAcc(code, name){
  const d = String(code)[0];
  const [tipe, normal] = d==='1' ? ['Aset','Debit'] : d==='2' ? ['Kewajiban','Kredit'] : d==='3' ? ['Ekuitas','Kredit'] : d==='4' ? ['Pendapatan','Kredit'] : d==='5' ? ['HPP','Debit'] : ['Beban','Debit'];
  return { id:String(code), nama:name || String(code), tipe, normal };
}
function buildCOA(stored, journals){
  const map = {};
  (stored.length ? stored : COA_DEFAULT).forEach(c => map[c.id] = c);
  COA_DEFAULT.forEach(c => { if (/^(1101|1102|1110|2101|410\d|5101)$/.test(c.id) && !map[c.id]) map[c.id] = c; });
  journals.forEach(j => (j.lines||[]).forEach(l => { if (l.acc && !map[l.acc]) map[l.acc] = inferAcc(l.acc, l.name); }));
  return Object.values(map).sort((a,b) => String(a.id).localeCompare(String(b.id)));
}

function showTab(id, el) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  $(id).classList.add('active');
  if (el) el.classList.add('active');
}
function changePeriod() {
  const custom = $('periodFilter').value === 'custom';
  $('dateFrom').style.display = $('dateTo').style.display = custom ? 'inline-block' : 'none';
  if (!custom) applyPeriod();
}
/* Tanggal dari <input type=date> dibaca sebagai tanggal LOKAL (bukan UTC) */
function localDate(v, endOfDay){
  const a = String(v).split('-').map(Number);
  return endOfDay ? new Date(a[0], a[1]-1, a[2], 23, 59, 59, 999) : new Date(a[0], a[1]-1, a[2]);
}
function getDateRange() {
  const val = $('periodFilter').value, now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  if (val === 'today') return { start: new Date(y, m, now.getDate()), end: new Date(y, m, now.getDate(), 23, 59, 59, 999) };
  if (val === 'month') return { start: new Date(y, m, 1), end: new Date(y, m+1, 0, 23, 59, 59, 999) };
  if (val === 'year')  return { start: new Date(y, 0, 1), end: new Date(y, 11, 31, 23, 59, 59, 999) };
  if (val === 'custom') return {
    start: $('dateFrom').value ? localDate($('dateFrom').value) : new Date(2000, 0, 1),
    end:   $('dateTo').value ? localDate($('dateTo').value, true) : new Date(3000, 0, 1)
  };
  return { start: new Date(2000, 0, 1), end: new Date(3000, 0, 1) };
}

async function loadData() {
  $('dashboard').innerHTML = '<div class="loader">⏳ Mengambil data dari cloud...</div>';
  try {
    const [coaSnap, jrnSnap] = await Promise.all([db.collection('coa').get(), db.collection('journals').get()]);
    JRN = jrnSnap.docs.map(d => ({id:d.id, ...d.data()})).filter(j => j.date && Array.isArray(j.lines));
    COA = buildCOA(coaSnap.docs.map(d => ({id:d.id, ...d.data()})), JRN);
    applyPeriod();
  } catch(e) {
    $('dashboard').innerHTML = `<div class="card" style="color:var(--red)">❌ Gagal memuat: ${esc(e.message)}</div>`;
  }
}
function applyPeriod(){
  const { start, end } = getDateRange();
  PERIOD = JRN.filter(j => { const d = jDate(j); return d >= start && d <= end; });   /* arus: laba rugi, jurnal */
  CUM = JRN.filter(j => jDate(j) <= end);                                            /* saldo s.d. akhir periode: neraca */
  renderAll();
}

function balances(journals) {
  const bal = {};
  COA.forEach(c => bal[c.id] = {...c, debit:0, credit:0});
  journals.forEach(j => j.lines.forEach(l => {
    if (bal[l.acc]) { bal[l.acc].debit += Number(l.debit)||0; bal[l.acc].credit += Number(l.credit)||0; }
  }));
  Object.values(bal).forEach(b => { b.net = b.debit - b.credit; b.final = b.normal === 'Debit' ? b.net : -b.net; });
  return bal;
}
const ofType = (bal, t) => Object.values(bal).filter(b => b.tipe === t);
const total = (bal, t) => sum(ofType(bal, t), b => b.final);
const profit = bal => total(bal, 'Pendapatan') - total(bal, 'HPP') - total(bal, 'Beban');

function renderAll() {
  const per = balances(PERIOD), cum = balances(CUM);
  renderDashboard(per, cum);
  renderLabarugi(per);
  renderNeraca(cum);
  renderJurnal();
  renderGL();
  renderTB(cum);
  renderManualForm();
}

function renderDashboard(per, cum) {
  const aset = total(cum, 'Aset'), kew = total(cum, 'Kewajiban'), ek = total(cum, 'Ekuitas'), labaCum = profit(cum), laba = profit(per);
  const check = Math.round(aset) === Math.round(kew + ek + labaCum);
  $('dashboard').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi blue"><div class="label">Total Aset</div><div class="value">${rp(aset)}</div></div>
      <div class="kpi"><div class="label">Kewajiban & Ekuitas</div><div class="value">${rp(kew+ek)}</div></div>
      <div class="kpi ${laba>=0?'green':'red'}"><div class="label">Laba Bersih Periode Ini</div><div class="value ${laba>=0?'green':'red'}">${rp(laba)}</div></div>
      <div class="kpi"><div class="label">Jumlah Jurnal</div><div class="value">${PERIOD.length}</div></div>
    </div>
    <div class="card">
      <h3>⚖️ Validasi Persamaan Dasar Akuntansi</h3>
      <p style="font-size:15px;line-height:1.6">Aset (<b>${rp(aset)}</b>) ${check ? '<span class="badge b-pos">SEIMBANG ✓</span>' : '<span class="badge b-neg">SELISIH! Periksa Jurnal</span>'} Kewajiban + Ekuitas + Laba (<b>${rp(kew+ek+labaCum)}</b>)</p>
    </div>`;
}

function renderLabarugi(bal) {
  const pend = ofType(bal,'Pendapatan'), hpp = ofType(bal,'HPP'), beb = ofType(bal,'Beban');
  const tPend = total(bal,'Pendapatan'), tHpp = total(bal,'HPP'), tBeb = total(bal,'Beban');
  const labaKotor = tPend - tHpp, labaBersih = labaKotor - tBeb;
  const row = (b, v) => `<tr><td class="indent no-i18n">${esc(b.nama)}</td><td class="num">${accRp(v)}</td><td></td></tr>`;
  const hl = v => `background:${v>=0?'#e4f0e8':'#fbe9e5'};color:${v>=0?'var(--green)':'var(--red)'}`;
  $('labarugi').innerHTML = `
    <div class="card"><h3>📈 Laporan Laba Rugi</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Uraian</th><th class="num">Nominal</th><th class="num">Total</th></tr></thead>
      <tbody>
        <tr class="row-subtotal"><td>PENDAPATAN</td><td></td><td></td></tr>
        ${pend.map(p=>row(p, p.final)).join('')}
        <tr class="row-total"><td>Total Pendapatan</td><td></td><td class="num">${rp(tPend)}</td></tr>
        <tr class="row-subtotal"><td>HARGA POKOK PENJUALAN (HPP)</td><td></td><td></td></tr>
        ${hpp.map(h=>row(h, -h.final)).join('')}
        <tr class="row-total"><td>Total HPP</td><td></td><td class="num">${accRp(-tHpp)}</td></tr>
        <tr class="row-total" style="${hl(labaKotor)}"><td>LABA KOTOR</td><td></td><td class="num">${rp(labaKotor)}</td></tr>
        <tr class="row-subtotal"><td>BEBAN OPERASIONAL</td><td></td><td></td></tr>
        ${beb.map(b=>row(b, -b.final)).join('')}
        <tr class="row-total"><td>Total Beban</td><td></td><td class="num">${accRp(-tBeb)}</td></tr>
        <tr class="row-total" style="${hl(labaBersih)};font-size:18px"><td>LABA BERSIH</td><td></td><td class="num">${rp(labaBersih)}</td></tr>
      </tbody>
    </table></div></div>`;
}

function renderNeraca(bal) {
  const aset = ofType(bal,'Aset'), kew = ofType(bal,'Kewajiban'), ek = ofType(bal,'Ekuitas'), laba = profit(bal);
  const totAset = total(bal,'Aset'), totKE = total(bal,'Kewajiban') + total(bal,'Ekuitas') + laba;
  const { end } = getDateRange();
  const per = end.getFullYear() < 2999 ? ' · per ' + end.toLocaleDateString(LOC(), {day:'numeric', month:'short', year:'numeric'}) : '';
  $('neraca').innerHTML = `
    <div class="card"><h3>⚖️ Neraca (Balance Sheet)<small class="muted-sm">${per}</small></h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Aset</th><th class="num">Nominal</th><th style="width:30px"></th><th>Kewajiban & Ekuitas</th><th class="num">Nominal</th></tr></thead>
      <tbody>
        ${aset.map(a=>`<tr><td class="no-i18n">${esc(a.nama)}</td><td class="num">${accRp(a.final)}</td><td></td><td></td><td></td></tr>`).join('')}
        <tr class="row-total"><td>TOTAL ASET</td><td class="num">${accRp(totAset)}</td><td></td><td></td><td></td></tr>
        <tr><td colspan="5" style="height:20px"></td></tr>
        ${[...kew, ...ek].map(k=>`<tr><td></td><td></td><td></td><td class="no-i18n">${esc(k.nama)}</td><td class="num">${accRp(k.final)}</td></tr>`).join('')}
        <tr><td></td><td></td><td></td><td>Laba Berjalan</td><td class="num">${accRp(laba)}</td></tr>
        <tr class="row-total"><td></td><td></td><td></td><td>TOTAL KEWAJIBAN & EKUITAS</td><td class="num">${accRp(totKE)}</td></tr>
      </tbody>
    </table></div></div>`;
}

function renderJurnal() {
  const sorted = [...PERIOD].sort((a,b) => jDate(b) - jDate(a));
  if (!sorted.length) { $('jurnal').innerHTML = '<div class="empty">Belum ada jurnal pada periode ini.</div>'; return; }
  $('jurnal').innerHTML = `
    <div class="card"><h3>📖 Jurnal Umum</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Tanggal</th><th>No. Ref</th><th>Keterangan</th><th>Akun</th><th class="num">Debit</th><th class="num">Kredit</th></tr></thead>
      <tbody>
        ${sorted.map(j => `
          <tr style="background:#fbf7ec;font-weight:700"><td>${jDate(j).toLocaleDateString(LOC())}</td><td>${esc(j.no)}</td><td class="no-i18n">${esc(j.desc)}</td><td></td><td></td><td></td></tr>
          ${j.lines.map(l => `<tr><td></td><td></td><td></td><td class="indent no-i18n">${esc(l.name)}</td><td class="num">${l.debit?rp(l.debit):'-'}</td><td class="num">${l.credit?rp(l.credit):'-'}</td></tr>`).join('')}
        `).join('')}
      </tbody>
    </table></div></div>`;
}

function renderGL() {
  const cur = $('glSelect') ? $('glSelect').value : '';
  $('gl').innerHTML = `
    <div class="card">
      <h3>📘 Buku Besar (General Ledger)</h3>
      <select id="glSelect" class="no-i18n" onchange="showGL()" style="margin-bottom:15px;max-width:400px">
        <option value="">-- ${esc(T('Pilih Akun'))} --</option>
        ${COA.map(c => `<option value="${esc(c.id)}" ${c.id===cur?'selected':''}>${esc(c.id)} - ${esc(c.nama)}</option>`).join('')}
      </select>
      <div id="glTable"></div>
    </div>`;
  if (cur) showGL();
}
function showGL() {
  const id = $('glSelect').value;
  if (!id) { $('glTable').innerHTML = ''; return; }
  const acc = COA.find(c => c.id === id);
  const { start } = getDateRange();
  /* saldo awal = semua mutasi sebelum periode, lalu mutasi periode berjalan */
  const net = l => (Number(l.debit)||0) - (Number(l.credit)||0);
  const sign = acc.normal === 'Debit' ? 1 : -1;
  let run = sign * sum(JRN.filter(j => jDate(j) < start), j => sum(j.lines.filter(l => l.acc === id), net));
  const rows = PERIOD.filter(j => j.lines.some(l => l.acc === id)).sort((a,b) => jDate(a) - jDate(b));
  $('glTable').innerHTML = `
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Tanggal</th><th>Keterangan</th><th class="num">Debit</th><th class="num">Kredit</th><th class="num">Saldo</th></tr></thead>
      <tbody>
        <tr><td></td><td>Saldo awal</td><td></td><td></td><td class="num" style="font-weight:700">${accRp(run)}</td></tr>
        ${rows.map(j => j.lines.filter(l => l.acc === id).map(l => {
          run += sign * net(l);
          return `<tr><td>${jDate(j).toLocaleDateString(LOC())}</td><td class="no-i18n">${esc(j.desc)}</td><td class="num">${rp(l.debit)}</td><td class="num">${rp(l.credit)}</td><td class="num" style="font-weight:700">${accRp(run)}</td></tr>`;
        }).join('')).join('')}
      </tbody>
    </table></div>`;
}

function renderTB(bal) {
  const rows = Object.values(bal).filter(b => Math.round(b.net) !== 0);
  const totDr = sum(rows, b => b.net > 0 ? b.net : 0), totCr = sum(rows, b => b.net < 0 ? -b.net : 0);
  $('tb').innerHTML = `
    <div class="card"><h3>⚖️ Neraca Saldo (Trial Balance)</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Kode</th><th>Nama Akun</th><th class="num">Debit</th><th class="num">Kredit</th></tr></thead>
      <tbody>
        ${rows.map(b => `<tr><td>${esc(b.id)}</td><td class="no-i18n">${esc(b.nama)}</td><td class="num">${b.net>0?rp(b.net):'-'}</td><td class="num">${b.net<0?rp(-b.net):'-'}</td></tr>`).join('')}
        <tr class="row-total"><td colspan="2">TOTAL</td><td class="num">${rp(totDr)}</td><td class="num">${rp(totCr)}</td></tr>
        <tr><td colspan="4" style="text-align:center;padding:15px">
          ${Math.round(totDr) === Math.round(totCr) ? '<span class="badge b-pos">SEIMBANG ✓</span>' : '<span class="badge b-neg">SELISIH! Periksa Jurnal.</span>'}
        </td></tr>
      </tbody>
    </table></div></div>`;
}

function renderManualForm() {
  const opts = COA.map(c => `<option value="${esc(c.id)}">${esc(c.id)} - ${esc(c.nama)}</option>`).join('');
  const dr = $('mDr').value, cr = $('mCr').value;
  $('mDr').innerHTML = opts; $('mCr').innerHTML = opts;
  if (dr) $('mDr').value = dr;
  if (cr) $('mCr').value = cr;
  if (!$('mDate').value) $('mDate').value = ymdLocal(new Date());
}
function ymdLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

async function saveManual() {
  const dateVal = $('mDate').value, desc = $('mDesc').value.trim();
  const drAcc = $('mDr').value, crAcc = $('mCr').value, amt = Math.round(parseFloat($('mAmt').value) || 0);
  if (!dateVal || !desc || amt <= 0) return alert('Isi tanggal, keterangan, dan nominal lebih dari 0.');
  if (drAcc === crAcc) return alert('Akun Debit dan Kredit harus berbeda.');
  const dr = COA.find(c=>c.id===drAcc), cr = COA.find(c=>c.id===crAcc);
  if (!confirm('Simpan jurnal: ' + dr.nama + ' (D) / ' + cr.nama + ' (K) ' + rp(amt) + '?')) return;
  const date = localDate(dateVal); date.setHours(12);
  const btn = $('btnSaveManual'); btn.disabled = true;
  try {
    await db.collection('journals').add({
      no: 'MAN-' + Date.now().toString(36).toUpperCase(), date: firebase.firestore.Timestamp.fromDate(date),
      desc, source: 'MANUAL', user: (currentUser()||{}).nama || '',
      lines: [ {acc: drAcc, name: dr.nama, debit: amt, credit: 0}, {acc: crAcc, name: cr.nama, debit: 0, credit: amt} ]
    });
    $('mDesc').value = ''; $('mAmt').value = '';
    alert('Jurnal manual tersimpan.');
    loadData();
  } catch (e) { alert('Gagal menyimpan: ' + e.message); }
  finally { btn.disabled = false; }
}

/* ===== Export ===== */
const stamp = () => ymdLocal(new Date());
const periodLabel = () => $('periodFilter').selectedOptions[0].textContent.trim();
function download(name, blob){
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function exportCSV() {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['Kode','Nama Akun','Tipe','Normal','Debit','Kredit','Saldo Akhir']];
  Object.values(balances(CUM)).forEach(b => rows.push([b.id, b.nama, b.tipe, b.normal, b.debit, b.credit, b.final]));
  download(`Neraca_Saldo_${stamp()}.csv`, new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\n')], {type:'text/csv;charset=utf-8'}));
}
function exportPDF() {
  if (!window.jspdf) return alert('Modul PDF belum termuat. Cek koneksi internet lalu muat ulang halaman.');
  const per = balances(PERIOD), cum = balances(CUM);
  const doc = new window.jspdf.jsPDF();
  let y = 15;
  const line = (text, size=10, bold=false) => {
    if (y > 280) { doc.addPage(); y = 15; }
    doc.setFontSize(size); doc.setFont(undefined, bold ? 'bold' : 'normal');
    doc.text(String(text).replace(/[^\x20-\x7e]/g, ''), 14, y);
    y += size >= 14 ? 8 : 6;
  };
  line('Laporan Keuangan - ' + periodLabel(), 16, true);
  line('Dicetak: ' + new Date().toLocaleString('id-ID'), 9); y += 4;
  line('NERACA SALDO', 12, true);
  const rows = Object.values(cum).filter(b => Math.round(b.net) !== 0);
  rows.forEach(b => line(b.id + '  ' + b.nama + '   D: ' + rp(Math.max(b.net,0)) + '   K: ' + rp(Math.max(-b.net,0)), 9));
  const dr = sum(rows, b => Math.max(b.net,0)), cr = sum(rows, b => Math.max(-b.net,0));
  line('TOTAL  D: ' + rp(dr) + '   K: ' + rp(cr) + (Math.round(dr)===Math.round(cr) ? '  (SEIMBANG)' : '  (SELISIH!)'), 10, true); y += 6;
  line('LABA / RUGI', 12, true);
  line('Pendapatan: ' + rp(total(per,'Pendapatan')), 10);
  line('HPP: (' + rp(total(per,'HPP')) + ')', 10);
  line('Beban: (' + rp(total(per,'Beban')) + ')', 10);
  line('LABA BERSIH: ' + rp(profit(per)), 11, true); y += 6;
  line('NERACA', 12, true);
  line('Total Aset: ' + rp(total(cum,'Aset')), 10);
  line('Kewajiban + Ekuitas + Laba: ' + rp(total(cum,'Kewajiban') + total(cum,'Ekuitas') + profit(cum)), 10);
  doc.save(`Laporan_Keuangan_${stamp()}.pdf`);
}
function exportExcel() {
  if (!window.XLSX) return alert('Modul Excel belum termuat. Cek koneksi internet lalu muat ulang halaman.');
  const wb = XLSX.utils.book_new();
  const tb = [['Kode','Nama Akun','Tipe','Debit','Kredit']];
  Object.values(balances(CUM)).filter(b => Math.round(b.net) !== 0).forEach(b => tb.push([b.id, b.nama, b.tipe, Math.max(b.net,0), Math.max(-b.net,0)]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(tb), 'Neraca Saldo');
  const jr = [['Tanggal','No. Ref','Keterangan','Akun','Debit','Kredit']];
  PERIOD.slice().sort((a,b) => jDate(a) - jDate(b)).forEach(j => j.lines.forEach(l => jr.push([jDate(j).toLocaleDateString('id-ID'), j.no, j.desc, l.name, Number(l.debit)||0, Number(l.credit)||0])));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(jr), 'Jurnal Umum');
  XLSX.writeFile(wb, `Laporan_Keuangan_${stamp()}.xlsx`);
}

window.addEventListener('senja-lang', () => { if (JRN.length || COA.length) renderAll(); });
guardPage({admin:true}).then(loadData);
